    <style>
      /* index.html과 같은 색·내비 스타일 */
      :root {
        --bg: #faf7f2;
        --ink: #1f1b16;
        --muted: #6b6259;
        --line: #e6dfd4;
        --accent: #b5562f;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.7;
        word-break: keep-all;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }
      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 24px;
      }
      nav {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(250, 247, 242, 0.9);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
      }
      nav .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 56px;
      }
      .logo {
        font-weight: 800;
        letter-spacing: -0.02em;
        text-decoration: none;
      }
      .logo span {
        color: var(--accent);
      }
      nav .back {
        font-size: 14px;
        color: var(--muted);
        text-decoration: none;
      }
      .eyebrow {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.2em;
        color: var(--accent);
        text-transform: uppercase;
      }
      header {
        padding: 88px 0 24px;
      }
      h1 {
        font-size: clamp(32px, 6vw, 56px);
        letter-spacing: -0.03em;
        font-weight: 800;
        margin-top: 12px;
      }
      section {
        padding: 40px 0 64px;
      }
      h2 {
        font-size: 22px;
        letter-spacing: -0.01em;
        margin-bottom: 20px;
      }
      h2 small {
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
        margin-left: 8px;
      }
      /* 사진 비율이 제각각이라 세로 컬럼(메이슨리)으로 배치 */
      .masonry {
        columns: 3 280px;
        column-gap: 12px;
      }
      .masonry a {
        display: block;
        margin-bottom: 12px;
        break-inside: avoid;
      }
      .masonry img {
        display: block;
        width: 100%;
        border-radius: 12px;
        filter: saturate(0.9);
      }
      .masonry a:hover img {
        filter: none;
      }
      dialog {
        margin: auto;
        border: 0;
        background: transparent;
        max-width: 92vw;
        max-height: 92vh;
      }
      dialog::backdrop {
        background: rgba(20, 16, 12, 0.9);
      }
      dialog img {
        display: block;
        max-width: 92vw;
        max-height: 92vh;
        border-radius: 8px;
      }
      footer {
        border-top: 1px solid var(--line);
        padding: 32px 0;
        font-size: 13px;
        color: var(--muted);
      }
      @media (max-width: 560px) {
        .wrap {
          padding: 0 16px;
        }
      }
    </style>

    <!-- 사진 클릭 시 크게 보기 (JS가 없으면 링크로 원본이 열림) -->
    <dialog id="view"><img alt="" /></dialog>
    <script>
      const view = document.getElementById("view");
      document.addEventListener("click", (e) => {
        const a = e.target.closest(".masonry a");
        if (a) {
          e.preventDefault();
          view.firstElementChild.src = a.href;
          view.firstElementChild.alt = a.firstElementChild.alt;
          view.showModal();
        } else if (e.target.closest("dialog")) view.close();
      });
    </script>
